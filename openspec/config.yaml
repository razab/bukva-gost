schema: spec-driven

context: |
  Language: ru. Писать артефакты по-русски; структурные заголовки OpenSpec,
  SHALL/MUST и GIVEN/WHEN/THEN сохранять на английском.
  «Буквы по ГОСТ»: дети 7–11 лет, желающие освоить русский чертёжный шрифт.
  ГОСТ 2.304-81, тип Б без наклона; действующая веб-сборка 2026-11-07.56.
  Baseline описывает существующее поведение и подтверждённые ограничения,
  а не завершённый App Store-продукт. Анализ: openspec/project-analysis.md.
  Контракты: openspec/specs/. Карта исходников и доказательств есть в анализе.
  Основной вход concepts/index.html; локальный авторский editor/ отделён.
  Runtime — обычные SVG/Canvas/JS, локальное хранилище, без npm/CDN зависимостей.
  Node.js нужен серверу и dev-инструментам; OpenSpec CLI 1.16.0 требует Node>=22.12.
  Контур TTF, модель оценки и учебный порядок различаются; порядок не норматив ГОСТ.
  Не менять model/outline/revision и записи ради перестановки демонстрации/стрелок.
  Одна страница на букву; оба регистра; 33 урока; только релевантные части букв.
  Указание владельца 06.11: цельную схему Я/я оставить, разделение на этапы отвергнуто.
  Бэклог PROJECT-PLAN.md не выполнять без нового запроса; дальнейший замер времени
  отложен, существующий сбор/показ не удалять. Не добавлять игровые системы,
  автоматическую диагностику и новые условия переходов по собственному решению.
  Проверки: npm test (3/32), npm run test:medium (9/32), npm run test:full (32).
  Medium/full измеряют >=70% строк, функций и ветвей browser JS. До расширения — canary.
  LAN-сервис уже работает на 8781 и отдаёт только concepts/; документация не требует
  перезапуска. Не расширять web-root до openspec/, editor/, references/ или исходников.
  Сначала утверждённый контракт, затем реализация и проверка. OpenSpec не добавляет
  повторных разрешений к уже порученной работе. Явный запрос только плана/исследования
  не является запросом менять продукт; факты, предложения и бэклог разделять.
  App Store-пакет, права на ASCON/PNG и аппаратная проверка iPad/Pencil не закрыты.

rules:
  proposal:
    - Указать пользовательскую проблему, затронутые существующие capabilities и границы текущего запроса.
    - Отделить подтверждённые факты от гипотез; не объявлять бэклог согласованной реализацией.
  specs:
    - Контракт описывает наблюдаемое поведение, а не имена функций и внутренние структуры.
    - Каждое требование содержит SHALL/MUST и хотя бы один Scenario с WHEN и THEN.
    - Сохранить полное содержание изменяемого требования; не терять прежние сценарии при MODIFIED.
  design:
    - Указать влияние на чернила, совместимость хранения, геометрию и реальную планшетную раскладку.
    - Зафиксировать причины отвергнутого подхода и минимальную проверку нового, если меняется подход.
  tasks:
    - Отдельные задачи canary, реализации, подходящих проверок и синхронизации спецификаций.
    - Отмечать выполненным только фактически завершённое; задачи устройства не заменять Node-тестами.

operations:
  apply:
    guidance:
      - Выполнять порученную работу до результата; новые продуктовые решения не домысливать.
      - Сохранять ограничения приватности, пользовательские записи и текущий работающий сервис.
  archive:
    guidance:
      - До архива проверить задачи, сценарии, соответствие runtime/spec и существенные ограничения доказательств.
