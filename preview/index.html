<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Буква А</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf5ef;color:#283c3d;font:18px system-ui,sans-serif}main{max-width:900px;margin:auto;padding:20px}header{display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:30px;margin:8px 0}h2{font-size:22px;margin:0 0 12px}button{font:inherit;border:0;border-radius:12px;background:#416c5e;color:white;padding:12px 16px;cursor:pointer}button.secondary{background:#dcebe3;color:#29493b}.intro{background:#fff;border-radius:22px;padding:18px;display:flex;align-items:center;gap:24px;margin:16px 0}.letter{width:130px;height:155px;flex:none}.guide{fill:none;stroke:#dce6df;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}.stroke{fill:none;stroke:#416c5e;stroke-width:8;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1}.playing .stroke{animation:draw .8s linear forwards}.playing .s2{animation-delay:.9s}.playing .s3{animation-delay:1.8s}@keyframes draw{to{stroke-dashoffset:0}}.sheet{position:relative;background:white;border-radius:22px;overflow:hidden;aspect-ratio: 800/600}.sheet svg,.sheet canvas{position:absolute;inset:0;width:100%;height:100%}.sheet canvas{touch-action:none}p{color:#667b72}footer{font-size:14px}@media(max-width:500px){main{padding:12px}.intro{gap:12px}.letter{width:85px;height:120px}h1{font-size:24px}h2{font-size:19px}button{font-size:16px}}
</style></head><body><main><header><h1>Буква А</h1><button id="clear" class="secondary">Очистить</button></header><section class="intro"><svg id="animation" class="letter playing" viewBox="0 0 100 120" aria-label="Буква А: первый штрих снизу вверх, второй сверху вниз, затем перекладина слева направо"><path class="guide" d="M10 108 L50 12 L90 108 M30 70 L70 70"/><path class="stroke s1" pathLength="1" d="M10 108 L50 12"/><path class="stroke s2" pathLength="1" d="M50 12 L90 108"/><path class="stroke s3" pathLength="1" d="M30 70 L70 70"/></svg><div><h2>Посмотри, как писать</h2><p>Вверх, вниз и перекладина.</p><button id="replay">▶ Показать ещё раз</button></div></section><h2>Обведи буквы и дорисуй арбуз</h2><div class="sheet"><svg viewBox="0 0 800 600" aria-hidden="true"><g fill="none" stroke="#a9bdb3" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 8"><path d="M40 245 L100 45 L160 245 M70 150 L130 150"/><path d="M240 245 L300 45 L360 245 M270 150 L330 150"/><path d="M440 245 L500 45 L560 245 M470 150 L530 150"/><path d="M640 245 L700 45 L760 245 M670 150 L730 150"/><path d="M200 390 Q400 275 600 390"/></g><path d="M200 390 Q400 650 600 390" fill="none" stroke="#283c3d" stroke-width="4" stroke-linecap="round"/><text x="400" y="565" text-anchor="middle" font-family="system-ui" font-size="22" fill="#283c3d">Арбуз</text></svg><canvas id="canvas" aria-label="Поле для рисования"></canvas></div><footer><p>Рисуй стилусом или пальцем. Рисунок сохраняется в этом браузере.</p><p id="status" role="status"></p></footer></main><script>
const canvas=document.querySelector('#canvas'),ctx=canvas.getContext('2d'),key='drawing-letter-a-v1';let strokes=[],active=null;const status=document.querySelector('#status');
try{const saved=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(saved))strokes=saved.filter(s=>Array.isArray(s)&&s.every(p=>Array.isArray(p)&&p.length===2&&p.every(Number.isFinite)))}catch{status.textContent='Не удалось прочитать сохранённый рисунок.'}
function draw(){const rect=canvas.getBoundingClientRect(),dpr=window.devicePixelRatio||1;canvas.width=Math.round(rect.width*dpr);canvas.height=Math.round(rect.height*dpr);ctx.setTransform(canvas.width,0,0,canvas.height,0,0);ctx.strokeStyle='#326eaf';ctx.lineWidth=5/rect.width;ctx.lineCap='round';ctx.lineJoin='round';for(const s of strokes){if(!s.length)continue;ctx.beginPath();ctx.moveTo(s[0][0],s[0][1]);if(s.length===1)ctx.lineTo(s[0][0]+.0001,s[0][1]);for(const p of s.slice(1))ctx.lineTo(p[0],p[1]);ctx.stroke()}}
function point(e){const r=canvas.getBoundingClientRect();return [(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]}
canvas.addEventListener('pointerdown',e=>{if(active!==null)return;e.preventDefault();active=e.pointerId;canvas.setPointerCapture(active);strokes.push([point(e)]);draw()});canvas.addEventListener('pointermove',e=>{if(e.pointerId!==active)return;for(const sample of e.getCoalescedEvents?.()||[e])strokes.at(-1).push(point(sample));draw()});function finish(e){if(e.pointerId!==active)return;active=null;try{localStorage.setItem(key,JSON.stringify(strokes));status.textContent=''}catch{status.textContent='Не удалось сохранить рисунок; пока он остаётся на экране.'}}canvas.addEventListener('pointerup',finish);canvas.addEventListener('pointercancel',finish);document.querySelector('#clear').onclick=()=>{if(confirm('Очистить рисунок на этом листе?')){strokes=[];draw();try{localStorage.removeItem(key);status.textContent=''}catch{status.textContent='Не удалось удалить сохранённый рисунок.'}}};document.querySelector('#replay').onclick=()=>{const el=document.querySelector('#animation');el.classList.remove('playing');void el.getBoundingClientRect();el.classList.add('playing')};new ResizeObserver(draw).observe(canvas);draw();
</script></body></html>
