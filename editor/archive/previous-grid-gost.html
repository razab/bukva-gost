];
function renderArt(index){const art=artExercises[index];document.querySelector('#art-guide').innerHTML=art.decor+`<path d="${art.fixed}" fill="none" stroke="#759287" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/><path d="${art.trace}" fill="none" stroke="#a8bcb2" stroke-width="2.5" stroke-dasharray="5 7" stroke-linecap="round" stroke-linejoin="round"/>`;document.querySelector('#art-canvas').setAttribute('aria-label',`Дорисовать линии ${art.name}`);document.querySelector('#art-reset').setAttribute('aria-label',`Сбросить рисунок ${art.name}`);return art.id}
// GOST 2.304-81: type Б, inclination 75 degrees, figure 7 and table 2.
// Work in d=10 units. Outer heights: h=100, c=70; widths along the grid: A=7d, а=5d.
const GOST=Object.freeze({type:'Б',angle:75,h:100,c:70,d:10,upperWidth:70,lowerWidth:50,baseline:140});
const incline=([x,y])=>[x+(135-y)/Math.tan(GOST.angle*Math.PI/180),y];
const slant=model=>model.map(line=>line.map(incline));
const models=slant([[[45,135],[75,45],[105,135]],[[58.5,94.5],[91.5,94.5]]]);
// Circular corners use the construction grid, not a generic font or CSS italic.
function circleArc(cx,cy,r,from,to,steps=16){return Array.from({length:steps},(_,i)=>{const a=from+(to-from)*(i+1)/steps;return [cx+r*Math.cos(a),cy+r*Math.sin(a)]})}

const lowercase=slant([uprightOval,[[95,75],[95,135]]]);
const oval=lowercase[0];
const roundedWarmup=[oval.map(([x,y])=>[x,y-15])];
const arcWarmup=slant([[[95,75],[65,75],...circleArc(65,85,10,-Math.PI/2,-Math.PI),[55,125],...circleArc(65,125,10,Math.PI,Math.PI/2),[95,135]]]);
const svgNS='http://www.w3.org/2000/svg';
const path=line=>line.map((p,i)=>`${i?'L':'M'}${p[0]} ${p[1]}`).join(' ');

const memory=new Map();let variant=0,data={},surfaces=[],history=[],activePointer=null,penActive=false,animation=null;
const message=document.querySelector('#message');
function load(){const key='letter-worksheet-v3-'+variant;if(memory.has(key))return structuredClone(memory.get(key));try{const v=JSON.parse(localStorage.getItem(key)||'{}');const out={};for(const [id,ss] of Object.entries(v||{}))if(Array.isArray(ss))out[id]=ss.filter(s=>Array.isArray(s)&&s.length&&s.every(p=>Array.isArray(p)&&p.length===2&&p.every(n=>Number.isFinite(n)&&Math.abs(n)<10)));return out}catch{message.textContent='Сохранение недоступно. Рисунок остаётся в этой вкладке.';return {}}}
function save(){const key='letter-worksheet-v3-'+variant;memory.set(key,structuredClone(data));try{localStorage.setItem(key,JSON.stringify(data))}catch{message.textContent='Не удалось сохранить рисунок. Он остаётся в этой вкладке.'}}
function snapshot(){history.push(structuredClone(data));if(history.length>20)history.shift();document.querySelector('#undo').disabled=false}
function refresh(){surfaces.forEach(s=>s.render());document.querySelector('#undo').disabled=!history.length}
function reset(id){if(activePointer!==null||!data[id]?.length)return;snapshot();data[id]=[];save();refresh()}
function setupSurface(canvas,id,width,height,scoreNode,resetButton,model=models){
 let draft=null,startPoint=null,pointer=null,renderFrame=null;
 const ctx=canvas.getContext('2d'),listeners=[];const listen=(type,fn)=>{canvas.addEventListener(type,fn);listeners.push([type,fn])};
 function render(){const rect=canvas.getBoundingClientRect(),ratio=devicePixelRatio||1;canvas.width=Math.max(1,Math.round(rect.width*ratio));canvas.height=Math.max(1,Math.round(rect.height*ratio));ctx.setTransform(canvas.width,0,0,canvas.height,0,0);ctx.lineWidth=(id.startsWith('art')?3:3.4)/width;ctx.strokeStyle='#335e99';ctx.lineCap='round';ctx.lineJoin='round';for(const s of [...(data[id]||[]),...(draft?[draft]:[])]){if(!s.length)continue;ctx.beginPath();ctx.moveTo(...s[0]);for(const p of s.slice(1))ctx.lineTo(...p);ctx.stroke()}if(scoreNode){const result=evaluate([...(data[id]||[]),...(draft?[draft]:[])],model);scoreNode.textContent=result.empty?'—':result.score+'%';scoreNode.dataset.band=result.empty?'empty':result.score>=90?'green':result.score>=80?'orange':'red';scoreNode.setAttribute('aria-label',result.empty?'Проба пуста':`Сходство ${result.score} процентов. Показать сброс пробы`)}resetButton.disabled=!(data[id]?.length);if(scoreNode){scoreNode.disabled=!(data[id]?.length);if(scoreNode.disabled)closeReset()}}
 function queueRender(){if(renderFrame===null)renderFrame=requestAnimationFrame(()=>{renderFrame=null;render()})}
 function closeReset(){if(scoreNode){resetButton.hidden=true;scoreNode.setAttribute('aria-expanded','false')}}
 if(scoreNode){closeReset();scoreNode.onclick=()=>{const show=resetButton.hidden;surfaces.forEach(s=>s.closeReset());resetButton.hidden=!show;scoreNode.setAttribute('aria-expanded',String(show))}}
 const point=e=>{const r=canvas.getBoundingClientRect();return [(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]};
 listen('pointerdown',e=>{if(activePointer!==null||e.button>0)return;surfaces.forEach(s=>s.closeReset());activePointer=e.pointerId;pointer=e.pointerId;penActive=e.pointerType==='pen';e.preventDefault();canvas.setPointerCapture(pointer);startPoint=point(e);draft=[startPoint];render()});
 listen('pointermove',e=>{if(e.pointerId!==pointer||!draft)return;const batch=e.getCoalescedEvents?.()||[e];for(const sample of batch){const p=point(sample);if(Math.hypot(p[0]-draft.at(-1)[0],p[1]-draft.at(-1)[1])>.0005)draft.push(p)}queueRender()});
 function finish(e,cancel=false){if(e.pointerId!==pointer)return;if(!cancel&&draft?.length>1){snapshot();(data[id]||=[]).push(draft)}draft=null;pointer=null;activePointer=null;penActive=false;render();save()}
 listen('pointerup',e=>finish(e));listen('pointercancel',e=>finish(e,true));listen('lostpointercapture',e=>finish(e,true));
 resetButton.onclick=()=>{reset(id);if(scoreNode)scoreNode.focus?.();closeReset()};const observer=new ResizeObserver(render);observer.observe(canvas);return {render,closeReset,destroy(){if(renderFrame!==null)cancelAnimationFrame(renderFrame);observer.disconnect();for(const [type,fn] of listeners)canvas.removeEventListener(type,fn)}};
}
function build(index){if(activePointer!==null)return;stopDemo();if(surfaces.length)save();surfaces.forEach(s=>s.destroy());surfaces=[];variant=index;history=[];data=load();document.body.dataset.variant=index;document.querySelectorAll('.variants button').forEach((b,i)=>b.setAttribute('aria-pressed',i===index));const root=document.querySelector('#practice');root.replaceChildren();const rows=2,columns=5;
 const warmups=[[[[75,40],[75,130]]],[[[75,40],[75,130]]],[[[40,85],[110,85]]],[[[40,85],[110,85]]],[[[45,130],[105,40]]],[[[45,40],[105,130]]],arcWarmup,roundedWarmup];
 const addCell=(row,id,model,label)=>{const cell=document.createElement('section');cell.className='cell';cell.innerHTML=`<div class="writing"><svg viewBox="0 0 150 180" aria-hidden="true">${model===lowercase?'<path d="M0 75H150" fill="none" stroke="var(--ruling)" stroke-width="1"/>':''}${guide(model)}</svg><canvas aria-label="${label}"></canvas></div><div class="cell-foot"><button type="button" class="score" aria-expanded="false" aria-label="Сходство, открыть сброс">—</button><button type="button" class="reset" hidden aria-label="Сбросить эту пробу" title="Сбросить эту пробу">↺</button></div>`;row.append(cell);surfaces.push(setupSurface(cell.querySelector('canvas'),id,150,180,cell.querySelector('.score'),cell.querySelector('.reset'),model))};
 const warmup=document.createElement('div');warmup.className='row warmup';warmups.forEach((model,i)=>addCell(warmup,'warmup-'+i,model,i<2?'Вертикальная линия':i<4?'Горизонтальная линия':i<6?'Наклонная линия':i===6?'Округлая дуга':'Овал'));root.append(warmup);
 for(let r=0;r<rows;r++){const row=document.createElement('div');row.className='row';for(let c=0;c<columns;c++)addCell(row,r===0?`gost-b75-upper-${c}`:`gost-b75-lower-${c}`,r===0?models:lowercase,`Буква ${r===0?'А':'а'}, проба ${c+1}`);root.append(row)}
 surfaces.push(setupSurface(document.querySelector('#art-canvas'),renderArt(index),200,200,null,document.querySelector('#art-reset')));refresh();playDemo()
}
function stopDemo(){if(animation!==null)cancelAnimationFrame(animation);animation=null}
function demoClock(model,{speed=84,startDelay=400,liftDelay=420,endDelay=1000}={}){
 let time=startDelay;
 const segments=model.map((points,i)=>{const distances=[0];for(let j=1;j<points.length;j++)distances.push(distances.at(-1)+Math.hypot(points[j][0]-points[j-1][0],points[j][1]-points[j-1][1]));const length=distances.at(-1),start=time,end=start+length/speed*1000;const next=model[i+1]?.[0],last=points.at(-1);time=end+(next&&Math.hypot(last[0]-next[0],last[1]-next[1])>.01?liftDelay:0);return {points,distances,length,start,end}});
 const duration=time+endDelay;
 return {segments,duration,at(elapsed,loop=true){const t=loop?Math.max(0,elapsed)%duration:Math.max(0,Math.min(duration,elapsed)),progress=segments.map(s=>Math.max(0,Math.min(1,(t-s.start)/(s.end-s.start))));let pen=null;const index=segments.findIndex(s=>t<s.end);if(index>=0){const s=segments[index];if(t<s.start){if(!index)pen=s.points[0]}else{const travel=s.length*progress[index];let j=1;while(j<s.distances.length-1&&s.distances[j]<travel)j++;const a=s.points[j-1],b=s.points[j],q=(travel-s.distances[j-1])/(s.distances[j]-s.distances[j-1]||1);pen=[a[0]+(b[0]-a[0])*q,a[1]+(b[1]-a[1])*q]}}return {progress,pen}}}
}
// Both forms share one timeline: upper -> 500 ms -> lower -> end hold -> repeat.
function sequenceClock(upperModel=models,lowerModel=lowercase){
 const upper=demoClock(upperModel,{startDelay:0,endDelay:0}),lower=demoClock(lowerModel,{startDelay:0,endDelay:0});
 const upperEnd=upper.duration,lowerStart=upperEnd+500,lowerEnd=lowerStart+lower.duration,duration=lowerEnd+1000;
 const empty=model=>({progress:model.map(()=>0),pen:null}),complete=model=>({progress:model.map(()=>1),pen:null});
 return {upperEnd,lowerStart,lowerEnd,duration,at(elapsed){const t=Math.max(0,elapsed)%duration;return {upper:t<upperEnd?upper.at(t,false):complete(upperModel),lower:t<lowerStart?empty(lowerModel):t<lowerEnd?lower.at(t-lowerStart,false):complete(lowerModel)}}};
}
function playDemo(){stopDemo();const demos=[['#demo',models],['#demo-lower',lowercase]].map(([selector,model])=>{const svg=document.querySelector(selector);svg.innerHTML=model.map(line=>`<path class="model-line" d="${path(line)}"/>`).join('')+model.map((line,i)=>`<path class="demo-ink" data-line="${i}" d="${path(line)}" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>`).reverse().join('')+`<g id="pencil"><circle r="7" fill="#fff9e6" stroke="#b88b3f"/><g transform="rotate(30)"><path d="M-4 -10V-37Q0 -42 4 -37V-10L0 0Z" fill="#e7b24f" stroke="#936b34" stroke-width="1"/><path d="M-4 -10H4L0 0Z" fill="#fff0c9"/><path d="M-1.5 -4L0 0L1.5 -4" fill="#354b3c"/></g></g>`;return {lines:model.map((_,i)=>svg.querySelector(`[data-line="${i}"]`)),pencil:svg.querySelector('#pencil')}});
 const start=performance.now(),clock=sequenceClock();function tick(now){const pair=clock.at(now-start);demos.forEach(({lines,pencil},index)=>{const state=index===0?pair.upper:pair.lower;lines.forEach((line,i)=>line.setAttribute('stroke-dashoffset',1-state.progress[i]));pencil.setAttribute('visibility',state.pen?'visible':'hidden');if(state.pen)pencil.setAttribute('transform',`translate(${state.pen[0]} ${state.pen[1]})`)});animation=requestAnimationFrame(tick)}tick(start)
}
// Geometric tracing similarity, not OCR or a calibrated handwriting grade.
// Sample physical strokes independently: lifting the pen never fills the gap.
const distance=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const pathLength=points=>points.slice(1).reduce((sum,p,i)=>sum+distance(points[i],p),0);
const clamp=value=>Math.max(0,Math.min(1,value));
function samples(strokes,budget=768){
 const lengths=strokes.map(pathLength),total=lengths.reduce((a,b)=>a+b,0),step=Math.max(1,total/Math.max(1,budget-strokes.length));
 const result=[];
 for(let k=0;k<strokes.length;k++){

function nearest(points,other){return points.map(p=>other.reduce((best,q)=>Math.min(best,distance(p,q)),Infinity));}
const mean=values=>values.length?values.reduce((a,b)=>a+b,0)/values.length:0;
function measureStrokeQuality(actualStrokes,expectedStrokes,{tolerance=4.5}={}){

 if(!actual.points.length||!expected.points.length)return {score:0,coverage:0,precision:0,lengthRatio:0,error:0};

 const completeness=coverage+precision?2*coverage*precision/(coverage+precision):0;
 const fidelity=Math.sqrt(mean(missing.map(d=>Math.exp(-(Math.max(0,d-.7)**2)/(2*tolerance**2))))*mean(extra.map(d=>Math.exp(-(Math.max(0,d-.7)**2)/(2*tolerance**2)))));

 const enoughInk=clamp(ratio/.9),excessInk=ratio>1.35?clamp(1.35/ratio):1;

}


function evaluate(strokes,model=models){if(!strokes.length)return {empty:true,score:0};const actual=strokes.map(s=>s.map(([x,y])=>({x:x*150,y:y*180}))),expected=model.map(s=>s.map(([x,y])=>({x,y})));const quality=measureStrokeQuality(actual,expected,{tolerance:8});let validDirection=true;
