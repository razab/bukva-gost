 const addCell=(row,id,model,label,ordered=false)=>{const cell=document.createElement('section');cell.className='cell';cell.innerHTML=`<div class="writing" data-assessment="${ordered?'ordered':'geometry'}"><svg viewBox="0 0 150 180" aria-hidden="true">${model===lowercase?'<path d="M0 70H150" fill="none" stroke="var(--ruling)" stroke-width="1"/>':''}${guide(model)}</svg><canvas aria-label="${label}"></canvas></div><div class="cell-foot"><button type="button" class="score" aria-expanded="false" aria-label="Сходство, открыть сброс">—</button><button type="button" class="reset" hidden aria-label="Сбросить эту пробу" title="Сбросить эту пробу">↺</button></div>`;row.append(cell);surfaces.push(setupSurface(cell.querySelector('canvas'),id,150,180,cell.querySelector('.score'),cell.querySelector('.reset'),model,ordered))};
 const warmup=document.createElement('div');warmup.className='row warmup';warmups.forEach((model,i)=>addCell(warmup,(i>=6?'warmup-upright-':'warmup-')+i,model,i<2?'Вертикальная линия':i<4?'Горизонтальная линия':i<6?'Наклонная линия':i===6?'Округлая дуга':'Овал'));root.append(warmup);
 for(let r=0;r<rows;r++){const row=document.createElement('div');row.className='row';for(let c=0;c<columns;c++)addCell(row,r===0?`gost-file-b90-upper-${c}`:`gost-file-b90-lower-${c}`,r===0?models:lowercase,`Буква ${r===0?'А':'а'}, проба ${c+1}`,true);root.append(row)}
 surfaces.push(setupSurface(document.querySelector('#art-canvas'),renderArt(index),200,200,null,document.querySelector('#art-reset')));refresh();playDemo()
}
function stopDemo(){if(animation!==null)cancelAnimationFrame(animation);animation=null}
function demoClock(model,{speed=84,startDelay=400,liftDelay=420,endDelay=1000}={}){
 let time=startDelay;
 const segments=model.map((points,i)=>{const distances=[0];for(let j=1;j<points.length;j++)distances.push(distances.at(-1)+Math.hypot(points[j][0]-points[j-1][0],points[j][1]-points[j-1][1]));const length=distances.at(-1),start=time,end=start+length/speed*1000;const next=model[i+1]?.[0],last=points.at(-1);time=end+(next&&Math.hypot(last[0]-next[0],last[1]-next[1])>.01?liftDelay:0);return {points,distances,length,start,end}});
 const duration=time+endDelay;
 return {segments,duration,at(elapsed,loop=true){const t=loop?Math.max(0,elapsed)%duration:Math.max(0,Math.min(duration,elapsed)),progress=segments.map(s=>Math.max(0,Math.min(1,(t-s.start)/(s.end-s.start))));let pen=null;const index=segments.findIndex(s=>t<s.end);if(index>=0){const s=segments[index];if(t<s.start){if(!index)pen=s.points[0]}else{const travel=s.length*progress[index];let j=1;while(j<s.distances.length-1&&s.distances[j]<travel)j++;const a=s.points[j-1],b=s.points[j],q=(travel-s.distances[j-1])/(s.distances[j]-s.distances[j-1]||1);pen=[a[0]+(b[0]-a[0])*q,a[1]+(b[1]-a[1])*q]}}return {progress,pen}}}
}
// Both forms share one timeline: upper -> 500 ms -> lower -> end hold -> repeat.
function sequenceClock(upperModel=models,lowerModel=lowercase){
 const upper=demoClock(upperModel,{startDelay:0,endDelay:0}),lower=demoClock(lowerModel,{startDelay:0,endDelay:0});
 const upperEnd=upper.duration,lowerStart=upperEnd+500,lowerEnd=lowerStart+lower.duration,duration=lowerEnd+1000;
 const empty=model=>({progress:model.map(()=>0),pen:null}),complete=model=>({progress:model.map(()=>1),pen:null});
 return {upperEnd,lowerStart,lowerEnd,duration,at(elapsed){const t=Math.max(0,elapsed)%duration;return {upper:t<upperEnd?upper.at(t,false):complete(upperModel),lower:t<lowerStart?empty(lowerModel):t<lowerEnd?lower.at(t-lowerStart,false):complete(lowerModel)}}};
}
// Mask and pen use worksheet coordinates. The font transform stays inside the masked group.
// Keep the mask for every frame, including completion: no final "fill everything" shortcut.
const revealLength=line=>line.slice(1).reduce((sum,p,i)=>sum+Math.hypot(p[0]-line[i][0],p[1]-line[i][1]),0);
// A wide brush reveals future branches at joins. Assign outline regions to
// the nearest sample of the ordered route, retaining a continuous stroke core.
const revealRegionsCache=new WeakMap();
function revealRegions(model){
 if(revealRegionsCache.has(model))return revealRegionsCache.get(model);
 const sites=[];
 model.forEach((line,stroke)=>{const length=revealLength(line),count=Math.ceil(length),distances=[0];for(let j=1;j<line.length;j++)distances.push(distances.at(-1)+Math.hypot(line[j][0]-line[j-1][0],line[j][1]-line[j-1][1]));let segment=1;for(let k=0;k<=count;k++){const travel=length*k/count;while(segment<line.length-1&&distances[segment]<travel)segment++;const a=line[segment-1],b=line[segment],t=(travel-distances[segment-1])/(distances[segment]-distances[segment-1]||1),point={x:a[0]+(b[0]-a[0])*t,y:a[1]+(b[1]-a[1])*t,stroke,progress:k/count};if(!sites.some(q=>Math.hypot(q.x-point.x,q.y-point.y)<.025))sites.push(point)}});
 function clip(poly,nx,ny,limit){const out=[];for(let j=0;j<poly.length;j++){const a=poly[j],b=poly[(j+1)%poly.length],da=a[0]*nx+a[1]*ny-limit,db=b[0]*nx+b[1]*ny-limit;if(da<=0)out.push(a);if(da*db<0){const t=da/(da-db);out.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t])}}return out}
 const regions=sites.map(site=>{let poly=[[0,0],[150,0],[150,180],[0,180]];const others=sites.filter(q=>q!==site).sort((a,b)=>(a.x-site.x)**2+(a.y-site.y)**2-(b.x-site.x)**2-(b.y-site.y)**2);for(const q of others){poly=clip(poly,q.x-site.x,q.y-site.y,(q.x*q.x+q.y*q.y-site.x*site.x-site.y*site.y)/2);if(!poly.length)break}return {...site,d:path(poly)+'Z'}});
 revealRegionsCache.set(model,regions);return regions;
}
function revealMarkup(model,maskId,progress=model.map(()=>0)){
 const regions=revealRegions(model).map(r=>`<path data-demo-region="${r.stroke}" data-reveal-at="${r.progress}" d="${r.d}" fill="white" stroke="white" stroke-width=".12" opacity="${progress[r.stroke]>0&&progress[r.stroke]>=r.progress?1:0}"/>`).join('');
 return fontOutline(model,'fill="#c7d4c8"')+`<defs><mask id="${maskId}" maskUnits="userSpaceOnUse" maskContentUnits="userSpaceOnUse" x="0" y="0" width="150" height="180">${regions}${model.map((line,i)=>`<path data-line="${i}" d="${path(line)}" fill="none" stroke="white" stroke-width="${10+boldExpansion()}" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="${revealLength(line)}" stroke-dashoffset="${revealLength(line)*(1-progress[i])}" opacity="${progress[i]>0?1:0}"/>`).join('')}</mask></defs><g mask="url(#${maskId})">`+fontOutline(model,'fill="var(--accent)"')+'</g>';
}
function playDemo(){stopDemo();const demos=[['#demo',models],['#demo-lower',lowercase]].map(([selector,model])=>{const svg=document.querySelector(selector);const maskId=selector==='#demo'?'font-mask-upper':'font-mask-lower';svg.innerHTML=revealMarkup(model,maskId)+`<g id="pencil"><circle r="7" fill="#fff9e6" stroke="#b88b3f"/><g transform="rotate(30)"><path d="M-4 -10V-37Q0 -42 4 -37V-10L0 0Z" fill="#e7b24f" stroke="#936b34" stroke-width="1"/><path d="M-4 -10H4L0 0Z" fill="#fff0c9"/><path d="M-1.5 -4L0 0L1.5 -4" fill="#354b3c"/></g></g>`;return {lines:model.map((line,i)=>({node:svg.querySelector(`[data-line="${i}"]`),length:revealLength(line)})),pencil:svg.querySelector('#pencil'),regions:[...svg.querySelectorAll('[data-demo-region]')].map(node=>({node,stroke:Number(node.dataset.demoRegion),at:Number(node.dataset.revealAt),visible:null}))}});
 const start=performance.now(),clock=sequenceClock();function tick(now){const pair=clock.at(now-start);demos.forEach(({lines,pencil,regions},index)=>{const state=index===0?pair.upper:pair.lower;for(const r of regions){const visible=state.progress[r.stroke]>0&&state.progress[r.stroke]>=r.at;if(visible!==r.visible){r.node.setAttribute('opacity',visible?'1':'0');r.visible=visible}}lines.forEach(({node,length},i)=>{node.setAttribute('stroke-dashoffset',length*(1-state.progress[i]));node.setAttribute('opacity',state.progress[i]>0?'1':'0')});pencil.setAttribute('visibility',state.pen?'visible':'hidden');if(state.pen)pencil.setAttribute('transform',`translate(${state.pen[0]} ${state.pen[1]})`)});animation=requestAnimationFrame(tick)}tick(start)
}
// Geometric tracing similarity, not OCR or a calibrated handwriting grade.
// Sample physical strokes independently: lifting the pen never fills the gap.
const distance=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const pathLength=points=>points.slice(1).reduce((sum,p,i)=>sum+distance(points[i],p),0);
const clamp=value=>Math.max(0,Math.min(1,value));
function samples(strokes,budget=768){
 const lengths=strokes.map(pathLength),total=lengths.reduce((a,b)=>a+b,0),step=Math.max(1,total/Math.max(1,budget-strokes.length));
 const result=[];
 for(let k=0;k<strokes.length;k++){
  const points=strokes[k];if(!points.length)continue;
  result.push(points[0]);let carry=step;
  for(let i=1;i<points.length;i++){
   const a=points[i-1],b=points[i],length=distance(a,b);
   if(!length)continue;
   for(let at=carry;at<=length;at+=step){const t=at/length;result.push({x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t});}
   carry=((carry-length)%step+step)%step;if(carry<1e-8)carry=step;
  }
  if(lengths[k]>0)result.push(points.at(-1));
 }
 return {points:result,length:total};
}
function nearest(points,other){return points.map(p=>other.reduce((best,q)=>Math.min(best,distance(p,q)),Infinity));}
const mean=values=>values.length?values.reduce((a,b)=>a+b,0)/values.length:0;
function measureStrokeQuality(actualStrokes,expectedStrokes,{tolerance=4.5}={}){
 const actual=samples(actualStrokes),expected=samples(expectedStrokes);
 if(!actual.points.length||!expected.points.length)return {score:0,coverage:0,precision:0,lengthRatio:0,error:0};
 const missing=nearest(expected.points,actual.points),extra=nearest(actual.points,expected.points);
 const coverage=mean(missing.map(d=>d<=tolerance?1:0)),precision=mean(extra.map(d=>d<=tolerance?1:0));
 const completeness=coverage+precision?2*coverage*precision/(coverage+precision):0;
 const fidelity=Math.sqrt(mean(missing.map(d=>Math.exp(-(Math.max(0,d-.7)**2)/(2*tolerance**2))))*mean(extra.map(d=>Math.exp(-(Math.max(0,d-.7)**2)/(2*tolerance**2)))));
 const ratio=expected.length?actual.length/expected.length:0;
 const enoughInk=clamp(ratio/.9),excessInk=ratio>1.35?clamp(1.35/ratio):1;
 return {score:Math.round(100*completeness*fidelity*enoughInk*excessInk),coverage,precision,lengthRatio:ratio,error:(mean(missing)+mean(extra))/2};
}


function evaluate(strokes,model=models,tolerance=preferences.tolerance,ordered=model===models||model===lowercase){if(!strokes.length)return {empty:true,score:0};const actual=strokes.map(s=>s.map(([x,y])=>({x:x*150,y:y*180}))),expected=model.map(s=>s.map(([x,y])=>({x,y})));const quality=measureStrokeQuality(actual,expected,{tolerance});
 // Warm-ups have no demonstrated stroke order: both directions are valid.
 // A hidden direction penalty must not pin their score at 59%.
 if(!ordered)return {empty:false,score:quality.score};
 let validDirection=true;
 // Accept connected sides as one stroke or as two adjoining physical strokes.
 let groups=actual;if(expected[0].length===3&&actual.length>=2&&distance(actual[0].at(-1),expected[0][1])<=12&&distance(actual[1][0],expected[0][1])<=12)groups=[[...actual[0],...actual[1]],...actual.slice(2)];
 groups.forEach((s,i)=>{const ref=expected[i];if(!ref||distance(s[0],ref[0])>Math.max(4,tolerance*1.75)){validDirection=false;return}if(s.length>2&&ref.length>3&&distance(ref[0],ref.at(-1))<1){const normalized=line=>{const total=pathLength(line),d=[0];for(let j=1;j<line.length;j++)d.push(d.at(-1)+distance(line[j-1],line[j]));return Array.from({length:32},(_,k)=>{const goal=total*k/31;let j=1;while(j<d.length-1&&d[j]<goal)j++;const a=line[j-1],b=line[j],t=(goal-d[j-1])/(d[j]-d[j-1]||1);return {x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t}})};const a=normalized(s),e=normalized(ref),forward=mean(a.map((p,j)=>distance(p,e[j]))),reverse=mean(a.map((p,j)=>distance(p,e.at(-1-j))));if(reverse<forward*.65)validDirection=false}});
 return {empty:false,score:Math.min(quality.score,validDirection?100:59)};
}
