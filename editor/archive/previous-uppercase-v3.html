position:absolute;inset:0;width:100%;height:100%}.art-surface canvas{touch-action:none}.art-container{position:relative}.art-reset{display:block;margin:0 14% 0 auto;border:0;background:transparent;color:#667e70;font-size:24px;width:42px;height:36px}.practice{display:grid;gap:22px}.row.warmup{grid-template-columns:repeat(6,minmax(0,1fr));padding-bottom:8px;border-bottom:1px solid var(--ruling)}.row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}.cell{min-width:0}.writing{position:relative;aspect-ratio:150/180;background:linear-gradient(to bottom,transparent calc(25% - .5px),var(--ruling) 25%,transparent calc(25% + .5px),transparent calc(75% - .5px),var(--ruling) 75%,transparent calc(75% + .5px))}.writing svg,.writing canvas{position:absolute;inset:0;width:100%;height:100%}.writing svg{pointer-events:none}.writing canvas{touch-action:none;z-index:1}.cell-foot{display:flex;align-items:center;justify-content:center;gap:10px;height:42px}.score{border:0;background:transparent;padding:8px 3px;min-height:40px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;font-size:18px;font-variant-numeric:tabular-nums;min-width:48px;text-align:center;color:#9aa89f}.score[data-band=green]{color:#33815a}.score[data-band=orange]{color:#b08330}.score[data-band=red]{color:#b66255}.reset{position:relative;z-index:2;width:40px;height:40px;border:0;border-radius:50%;background:transparent;color:#657f70;font-size:25px}.reset:hover,.art-reset:hover{background:#edf2eb}.guide{fill:none;stroke:#b0c1b5;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:3 5}.corridor{fill:none;stroke:#e7f0e6;stroke-width:16;stroke-linecap:round;stroke-linejoin:round}.model-line{fill:none;stroke:#c7d4c8;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.demo-ink{fill:none;stroke:var(--accent);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}.message{max-width:1000px;margin:auto;padding:0 24px;color:#b66255;font-size:14px}body[data-variant="1"]{--accent:#b35e43;--ruling:#eddcd0;--paper:#fffaf4;background:#f2e5d8}body[data-variant="1"] .sheet{border-radius:28px;padding:32px}body[data-variant="1"] .practice{gap:28px}body[data-variant="1"] .row{gap:22px}body[data-variant="1"] .writing{background-color:#f7efe4;border-radius:15px}body[data-variant="1"] .corridor{stroke:#f2e1cf}body[data-variant="2"]{--accent:#72639d;--ruling:#e7e2f1;--paper:#fff;background:#eceaf4}body[data-variant="2"] .sheet{display:grid;grid-template-columns:220px 1fr;gap:28px;border-radius:18px}body[data-variant="2"] .hero{display:flex;flex-direction:column;justify-content:flex-start;border-right:1px solid #e7e2f1;padding-right:24px}body[data-variant="2"] .demo{flex-direction:column}body[data-variant="2"] .demo svg{max-width:100%}body[data-variant="2"] .art{flex-direction:column;width:100%}body[data-variant="2"] .art img{width:100%}body[data-variant="2"] .art-surface{width:100%}body[data-variant="2"] .row{grid-template-columns:repeat(3,minmax(0,1fr))}body[data-variant="2"] .corridor{stroke:#efebf7}body[data-variant="3"]{--accent:#2f7994;--ruling:#d4e5eb;--paper:#fbfeff;background:#e1ebef}body[data-variant="3"] .sheet{border-radius:0;border:1px solid #adc9d1;background-image:linear-gradient(#c9dfe533 1px,transparent 1px),linear-gradient(90deg,#c9dfe533 1px,transparent 1px);background-size:22px 22px}body[data-variant="3"] .corridor{stroke:#e1eff3}body[data-variant="3"] .writing{background-color:#ffffffbb}body[data-variant="4"]{--accent:#af5b4a;--ruling:#eee2c8;--paper:#fffdf5;background:#f3edda}body[data-variant="4"] .hero{grid-template-columns:200px 1fr}body[data-variant="4"] .art img{max-width:240px}body[data-variant="4"] .art-surface{max-width:240px}body[data-variant="4"] .sheet{border-radius:26px}body[data-variant="4"] .corridor{stroke:#f2ebdb}@media(max-width:750px){.sheet{margin:10px 12px;padding:20px 14px}.hero{gap:8px}.demo{gap:6px}.demo svg{height:160px}.row{gap:3px}.cell-foot{gap:0}.score{border:0;background:transparent;padding:8px 3px;min-height:40px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;font-size:15px;min-width:38px}.reset{width:34px}.tools{padding:10px 14px}body[data-variant="2"] .sheet{grid-template-columns:145px 1fr;gap:10px}body[data-variant="2"] .hero{padding-right:12px}body[data-variant="4"] .hero{grid-template-columns:140px 1fr}}
</style></head><body data-variant="0"><nav class="variants" aria-label="Варианты листа"></nav><div class="tools"><strong>А</strong><div class="actions"><button id="undo" disabled>↶ Отменить</button><button id="clear-all">Сбросить всё</button></div></div><main class="sheet"><div class="hero"><div class="demo"><svg id="demo" viewBox="0 0 150 180" aria-label="Показ написания А"></svg><button class="play" id="play" aria-label="Повторить показ написания">▶</button></div><div class="art-container"><div class="art"><img id="reference" src="assets/watermelon-reference.png" alt="Арбуз — образец"><div class="art-surface"><svg viewBox="0 0 200 200" aria-hidden="true"><path d="M100 25 L163 85 L100 151" fill="none" stroke="#7d9c80" stroke-width="3" stroke-linejoin="round"/><path d="M100 151 L37 85 L100 25 M37 85 H163 M100 25 V151" fill="none" stroke="#b0c3b0" stroke-width="2.5" stroke-dasharray="5 7" stroke-linecap="round"/><path d="M100 151 Q120 170 97 183" fill="none" stroke="#7d9c80" stroke-width="2"/><path d="M110 162l-10 -3 2 12z" fill="#edd4b4"/></svg><canvas id="art-canvas" aria-label="Дорисовать линии воздушного змея"></canvas></div></div><button class="art-reset" id="art-reset" aria-label="Сбросить рисунок воздушного змея" title="Сбросить рисунок">↺</button></div></div><div class="practice" id="practice"></div></main><div id="message" class="message" role="status"></div><script>

const names=['Тетрадь','Тёплая мастерская','Крупный план','Чертёжный лист','Альбом'];
const models=[[[40,135],[75,45],[110,135]],[[59.95,96.3],[90.05,96.3]]];
const svgNS='http://www.w3.org/2000/svg';
const path=line=>line.map((p,i)=>`${i?'L':'M'}${p[0]} ${p[1]}`).join(' ');
const guide=(model=models)=>model.map(line=>`<path d="${path(line)}" class="corridor"/>`).join('')+model.map(line=>`<path d="${path(line)}" class="guide"/>`).join('');
const memory=new Map();let variant=0,data={},surfaces=[],history=[],activePointer=null,penActive=false,animation=null;
const message=document.querySelector('#message');
function load(){const key='letter-worksheet-v3-'+variant;if(memory.has(key))return structuredClone(memory.get(key));try{const v=JSON.parse(localStorage.getItem(key)||'{}');const out={};for(const [id,ss] of Object.entries(v||{}))if(Array.isArray(ss))out[id]=ss.filter(s=>Array.isArray(s)&&s.length&&s.every(p=>Array.isArray(p)&&p.length===2&&p.every(n=>Number.isFinite(n)&&Math.abs(n)<10)));return out}catch{message.textContent='Сохранение недоступно. Рисунок остаётся в этой вкладке.';return {}}}
function save(){const key='letter-worksheet-v3-'+variant;memory.set(key,structuredClone(data));try{localStorage.setItem(key,JSON.stringify(data))}catch{message.textContent='Не удалось сохранить рисунок. Он остаётся в этой вкладке.'}}
function snapshot(){history.push(structuredClone(data));if(history.length>20)history.shift();document.querySelector('#undo').disabled=false}
function refresh(){surfaces.forEach(s=>s.render());document.querySelector('#undo').disabled=!history.length}
function reset(id){if(activePointer!==null||!data[id]?.length)return;snapshot();data[id]=[];save();refresh()}
function setupSurface(canvas,id,width,height,scoreNode,resetButton,model=models){
 let draft=null,startPoint=null,pointer=null,renderFrame=null;
 const ctx=canvas.getContext('2d'),listeners=[];const listen=(type,fn)=>{canvas.addEventListener(type,fn);listeners.push([type,fn])};
 function render(){const rect=canvas.getBoundingClientRect(),ratio=devicePixelRatio||1;canvas.width=Math.max(1,Math.round(rect.width*ratio));canvas.height=Math.max(1,Math.round(rect.height*ratio));ctx.setTransform(canvas.width,0,0,canvas.height,0,0);ctx.lineWidth=(id.startsWith('art')?3:3.4)/width;ctx.strokeStyle='#335e99';ctx.lineCap='round';ctx.lineJoin='round';for(const s of [...(data[id]||[]),...(draft?[draft]:[])]){if(!s.length)continue;ctx.beginPath();ctx.moveTo(...s[0]);for(const p of s.slice(1))ctx.lineTo(...p);ctx.stroke()}if(scoreNode){const result=evaluate([...(data[id]||[]),...(draft?[draft]:[])],model);scoreNode.textContent=result.empty?'—':result.score+'%';scoreNode.dataset.band=result.empty?'empty':result.score>=90?'green':result.score>=80?'orange':'red';scoreNode.setAttribute('aria-label',result.empty?'Проба пуста':`Сходство ${result.score} процентов. Показать сброс пробы`)}resetButton.disabled=!(data[id]?.length);if(scoreNode){scoreNode.disabled=!(data[id]?.length);if(scoreNode.disabled)closeReset()}}
 function queueRender(){if(renderFrame===null)renderFrame=requestAnimationFrame(()=>{renderFrame=null;render()})}
 function closeReset(){if(scoreNode){resetButton.hidden=true;scoreNode.setAttribute('aria-expanded','false')}}
 if(scoreNode){closeReset();scoreNode.onclick=()=>{const show=resetButton.hidden;surfaces.forEach(s=>s.closeReset());resetButton.hidden=!show;scoreNode.setAttribute('aria-expanded',String(show))}}
 const point=e=>{const r=canvas.getBoundingClientRect();return [(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]};
 listen('pointerdown',e=>{if(activePointer!==null||e.button>0)return;surfaces.forEach(s=>s.closeReset());activePointer=e.pointerId;pointer=e.pointerId;penActive=e.pointerType==='pen';e.preventDefault();canvas.setPointerCapture(pointer);startPoint=point(e);draft=[startPoint];stopDemo();render()});
 listen('pointermove',e=>{if(e.pointerId!==pointer||!draft)return;const batch=e.getCoalescedEvents?.()||[e];for(const sample of batch){const p=point(sample);if(Math.hypot(p[0]-draft.at(-1)[0],p[1]-draft.at(-1)[1])>.0005)draft.push(p)}queueRender()});
 function finish(e,cancel=false){if(e.pointerId!==pointer)return;if(!cancel&&draft?.length>1){snapshot();(data[id]||=[]).push(draft)}draft=null;pointer=null;activePointer=null;penActive=false;render();save()}
 listen('pointerup',e=>finish(e));listen('pointercancel',e=>finish(e,true));listen('lostpointercapture',e=>finish(e,true));
 resetButton.onclick=()=>{reset(id);if(scoreNode)scoreNode.focus?.();closeReset()};const observer=new ResizeObserver(render);observer.observe(canvas);return {render,closeReset,destroy(){if(renderFrame!==null)cancelAnimationFrame(renderFrame);observer.disconnect();for(const [type,fn] of listeners)canvas.removeEventListener(type,fn)}};
}
function build(index){if(activePointer!==null)return;stopDemo();if(surfaces.length)save();surfaces.forEach(s=>s.destroy());surfaces=[];variant=index;history=[];data=load();document.body.dataset.variant=index;document.querySelectorAll('.variants button').forEach((b,i)=>b.setAttribute('aria-pressed',i===index));const root=document.querySelector('#practice');root.replaceChildren();const rows=2,columns=index===2?3:5;
 const warmups=[[[[75,40],[75,130]]],[[[75,40],[75,130]]],[[[40,85],[110,85]]],[[[40,85],[110,85]]],[[[45,130],[105,40]]],[[[45,40],[105,130]]]];
 const addCell=(row,id,model,label)=>{const cell=document.createElement('section');cell.className='cell';cell.innerHTML=`<div class="writing"><svg viewBox="0 0 150 180" aria-hidden="true">${guide(model)}</svg><canvas aria-label="${label}"></canvas></div><div class="cell-foot"><button type="button" class="score" aria-expanded="false" aria-label="Сходство, открыть сброс">—</button><button type="button" class="reset" hidden aria-label="Сбросить эту пробу" title="Сбросить эту пробу">↺</button></div>`;row.append(cell);surfaces.push(setupSurface(cell.querySelector('canvas'),id,150,180,cell.querySelector('.score'),cell.querySelector('.reset'),model))};
 const warmup=document.createElement('div');warmup.className='row warmup';warmups.forEach((model,i)=>addCell(warmup,'warmup-'+i,model,i<2?'Вертикальная линия':i<4?'Горизонтальная линия':'Наклонная линия'));root.append(warmup);
 for(let r=0;r<rows;r++){const row=document.createElement('div');row.className='row';for(let c=0;c<columns;c++)addCell(row,`${r}-${c}`,models,`Буква А, проба ${r*columns+c+1}`);root.append(row)}
 surfaces.push(setupSurface(document.querySelector('#art-canvas'),'art-kite',200,200,null,document.querySelector('#art-reset')));refresh();playDemo()
}
function stopDemo(){if(animation!==null)cancelAnimationFrame(animation);animation=null}
function playDemo(){stopDemo();const svg=document.querySelector('#demo');svg.innerHTML=models.map(line=>`<path class="model-line" d="${path(line)}"/>`).join('')+models.map((line,i)=>`<path class="demo-ink" data-line="${i}" d="${path(line)}" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>`).reverse().join('')+`<g id="pencil"><circle r="7" fill="#fff9e6" stroke="#b88b3f"/><g transform="rotate(30)"><path d="M-4 -10V-37Q0 -42 4 -37V-10L0 0Z" fill="#e7b24f" stroke="#936b34" stroke-width="1"/><path d="M-4 -10H4L0 0Z" fill="#fff0c9"/><path d="M-1.5 -4L0 0L1.5 -4" fill="#354b3c"/></g></g>`;
 const lines=[svg.querySelector('[data-line="0"]'),svg.querySelector('[data-line="1"]')],pencil=svg.querySelector('#pencil'),start=performance.now();
 function tick(now){const t=(now-start)%4800;let pos=null;const p=Math.max(0,Math.min(1,(t-400)/2300)),q=Math.max(0,Math.min(1,(t-3100)/650));lines[0].setAttribute('stroke-dashoffset',1-p);lines[1].setAttribute('stroke-dashoffset',1-q);if(t<2700){let v=p*2,i=v<1?0:1,vv=i?v-1:v;const a=models[0][i],b=models[0][i+1];pos=[a[0]+(b[0]-a[0])*vv,a[1]+(b[1]-a[1])*vv]}else if(t>=3100&&t<3750){const [a,b]=models[1];pos=[a[0]+(b[0]-a[0])*q,a[1]+(b[1]-a[1])*q]}pencil.setAttribute('visibility',pos?'visible':'hidden');if(pos)pencil.setAttribute('transform',`translate(${pos[0]} ${pos[1]})`);animation=requestAnimationFrame(tick)}animation=requestAnimationFrame(tick)
}
// Geometric tracing similarity, not OCR or a calibrated handwriting grade.
// Sample physical strokes independently: lifting the pen never fills the gap.
const distance=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const pathLength=points=>points.slice(1).reduce((sum,p,i)=>sum+distance(points[i],p),0);
const clamp=value=>Math.max(0,Math.min(1,value));
function samples(strokes,budget=768){
 const lengths=strokes.map(pathLength),total=lengths.reduce((a,b)=>a+b,0),step=Math.max(1,total/Math.max(1,budget-strokes.length));
 const result=[];
 for(let k=0;k<strokes.length;k++){
  const points=strokes[k];if(!points.length)continue;
  result.push(points[0]);let carry=step;
  for(let i=1;i<points.length;i++){
   const a=points[i-1],b=points[i],length=distance(a,b);
   if(!length)continue;
   for(let at=carry;at<=length;at+=step){const t=at/length;result.push({x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t});}
   carry=((carry-length)%step+step)%step;if(carry<1e-8)carry=step;
  }
  if(lengths[k]>0)result.push(points.at(-1));
 }
 return {points:result,length:total};
}
function nearest(points,other){return points.map(p=>other.reduce((best,q)=>Math.min(best,distance(p,q)),Infinity));}
const mean=values=>values.length?values.reduce((a,b)=>a+b,0)/values.length:0;
function measureStrokeQuality(actualStrokes,expectedStrokes,{tolerance=4.5}={}){
 const actual=samples(actualStrokes),expected=samples(expectedStrokes);
 if(!actual.points.length||!expected.points.length)return {score:0,coverage:0,precision:0,lengthRatio:0,error:0};
 const missing=nearest(expected.points,actual.points),extra=nearest(actual.points,expected.points);
 const coverage=mean(missing.map(d=>d<=tolerance?1:0)),precision=mean(extra.map(d=>d<=tolerance?1:0));
 const completeness=coverage+precision?2*coverage*precision/(coverage+precision):0;
 const fidelity=Math.sqrt(mean(missing.map(d=>Math.exp(-(Math.max(0,d-.7)**2)/(2*tolerance**2))))*mean(extra.map(d=>Math.exp(-(Math.max(0,d-.7)**2)/(2*tolerance**2)))));
 const ratio=expected.length?actual.length/expected.length:0;
 const enoughInk=clamp(ratio/.9),excessInk=ratio>1.35?clamp(1.35/ratio):1;
 return {score:Math.round(100*completeness*fidelity*enoughInk*excessInk),coverage,precision,lengthRatio:ratio,error:(mean(missing)+mean(extra))/2};
}


function evaluate(strokes,model=models){if(!strokes.length)return {empty:true,score:0};const actual=strokes.map(s=>s.map(([x,y])=>({x:x*150,y:y*180}))),expected=model.map(s=>s.map(([x,y])=>({x,y})));const quality=measureStrokeQuality(actual,expected,{tolerance:8});let validDirection=true;
 // Accept connected sides as one stroke or as two adjoining physical strokes.
 let groups=actual;if(expected[0].length===3&&actual.length>=2&&distance(actual[0].at(-1),expected[0][1])<=12&&distance(actual[1][0],expected[0][1])<=12)groups=[[...actual[0],...actual[1]],...actual.slice(2)];
 groups.forEach((s,i)=>{const ref=expected[i];if(!ref||distance(s[0],ref[0])>14)validDirection=false});
 return {empty:false,score:Math.min(quality.score,validDirection?100:59)};
}
names.forEach((name,i)=>{const b=document.createElement('button');b.textContent=name;b.onclick=()=>build(i);document.querySelector('.variants').append(b)});
document.querySelector('#play').onclick=playDemo;document.querySelector('#clear-all').onclick=()=>{if(activePointer!==null||!Object.values(data).some(s=>s.length))return;snapshot();data={};save();refresh()};document.querySelector('#undo').onclick=()=>{if(activePointer!==null||!history.length)return;data=history.pop();save();refresh()};
// Existing v1 drawings remain available in previous-v1.html under their original keys.
build(0);
</script></body></html>
